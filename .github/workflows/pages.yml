# Сборка веб-версии (HTML5/wasm) через bob и публикация на GitHub Pages.
# Версия движка — та же, что у редактора на ПК (Defold 1.14.0).
name: Web build → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DEFOLD_SHA: d295ed4edff2e49072719835713e625f409849f1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download bob
        run: curl -fsSL -o bob.jar "https://d.defold.com/archive/stable/${DEFOLD_SHA}/bob/bob.jar"
      - name: Build HTML5
        run: |
          java -jar bob.jar --platform wasm-web --architectures wasm-web --variant release \
            --archive --bundle-output dist resolve build bundle
      - name: Prepare site
        run: |
          mkdir site
          cp -r dist/*/* site/
          touch site/.nojekyll
          # свои имена файлов игры у каждой сборки: браузер не возьмёт старые из кэша (Pages кэширует 10 мин)
          V=${GITHUB_SHA::8}
          if [ -d site/archive ] && grep -q '"archive" + path' site/index.html; then
            mv site/archive "site/archive_$V"
            sed -i "s|\"archive\" + path|\"archive_$V\" + path|" site/index.html
          fi
          grep -n "archive" site/index.html | head
          grep -o '.\{60\}archive.\{60\}' site/dmloader.js | head -20
          ls -la site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
